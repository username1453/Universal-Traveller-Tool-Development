name: Manual Map Generation
on: 
  workflow_dispatch: # This creates the "Run Workflow" button in GitHub Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install matplotlib # Required by starport_generator.py[cite: 1]
        
      - name: Run Bulk Generator
        run: python bulk_generate.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "Starport Bot"
          git config --global user.email "actions@github.com"
          git add starportmaps/
          git commit -m "Regenerated starport maps from PlanetaryData.js" || echo "No changes"
          git push
